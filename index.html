<script>
/* ╔═══════════════════════════════════════════════════════════════════════╗

   ╚═══════════════════════════════════════════════════════════════════════╝

const CONFIG = {

  /* ─── 0. PROVENIENZA (per A/B test tra le due landing) ──────────────── */
  origine: "Landing Degustazione",

  /* ─── 1. BRAND / IDENTITÀ ───────────────────────────────────────────── */
  brand: {
    nome:     "Antica Trattoria Cirio",  // nome del ristorante
    tagline:  "Cucina piemontese · Torino",  // piccola scritta sopra il titolo
    logo:     "logo.png",             // path immagine logo (mostrato senza riquadro); se "" usa le iniziali
    iniziali: "AC",                   // fallback mostrato nel cerchio se manca il logo
    // Logo TESTUALE (wordmark) senza riquadro: ha priorità su logo/iniziali. "" per non usarlo.
    logoWordmark: '',
  },

  /* ─── 2. COLORI BRAND (default nero / bianco / oro Food Media Lab) ───── */
  colori: {
    oro:        "#b8933a",  // colore accento principale
    oroChiaro:  "#e8d5a3",
    oroPale:    "#fdf6e3",
    nero:       "#1a1612",  // testo e sfondi scuri
    inkLight:   "#4a4540",
    crema:      "#faf8f4",  // sfondo pagina
    bianco:     "#ffffff",
    ctaBg:      "#b8933a",  // sfondo del bottone CTA (default oro)
    ctaText:    "#1a1612",  // testo del bottone CTA (default nero)
  },

  /* ─── 3. HERO (headline + sottotitolo, unica sezione di testo) ───────── */
  hero: {
    // Usa <em> per evidenziare una parola in oro corsivo
    headline:    "Vivi l'esperienza della<br><em>vera cucina piemontese</em> a Torino",
    sottotitolo: "Piatti autentici della tradizione, preparati come una volta: da Cirio ritrovi sapori che altrove non troverai più. Prenota il tuo tavolo e lasciati sorprendere.",

    // Riga di riconoscimento sotto il sottotitolo ("" per non mostrarla)
    riconoscimento: "MICHELIN 2026",

    // Bottone sotto l'hero che porta al form
    cta: {
      testo:  "Prenota un tavolo",
      target: "prenota",
    },
  },

  /* ─── 3-bis. OFFERTA MENU DEGUSTAZIONE (blocco sotto l'hero) ─────────── */
  /* Metti attivo:false per nascondere del tutto il blocco offerta.         */
  degustazione: {
    attivo:    true,
    occhiello: "La proposta di Cirio",
    titolo:    "Menù degustazione",
    testo:     "Fatti trasportare nel percorso di Cirio: una degustazione dei nostri piatti di eccellenza, un'esperienza immersa nella vera cucina piemontese.",
    prezzo:    "45 €",
    prezzoNota:"a persona",
    validita:  "Fino a fine agosto",

    // Il menu vero e proprio, mostrato dentro il box offerta.
    menu: {
      titolo:     "Un viaggio nella tradizione piemontese",
      sottotitolo:"",   // "" = nessun sottotitolo
      piatti: [
        "Antipasto misto",
        "Agnolotto al sugo d'arrosto fatto a mano",
        "Guancia brasata su purè di patate",
        "Pesche ripiene alla langarola",
      ],
      // Riga sotto l'elenco, staccata dai piatti ("" per non mostrarla)
      incluso: "Acqua, caffè e vino inclusi",
    },

    // Bottone che porta al form di prenotazione.
    cta: {
      testo:  "Prenota ora",
      target: "prenota",   // id della sezione a cui scorrere
    },

    // Riga sotto il bottone ("" per non mostrarla)
    urgenza: "Posti limitati",
  },

  /* ─── 3-ter. GALLERIA FOTO (3 immagini, sotto il form) ───────────────── */
  /* Metti attivo:false per nascondere la galleria.                         */
  /* Sostituisci i file foto-1/2/3.jpg nella cartella con le foto reali.    */
  galleria: {
    attivo: true,
    // Come l'headline dell'hero: <em> evidenzia una parola in oro corsivo
    titolo: "Un'esperienza <em>unica</em> della tradizione",
    sottotitolo: "Pasta tirata a mano al mattino, sugo d'arrosto che sobbolle per ore, ogni dettaglio curato con la pazienza di sempre. Da Cirio non scegli un piatto: ti siedi e ti lasci accompagnare, portata dopo portata.",
    foto: [
      // Tutte e quattro in verticale: griglia 2×2 (vedi .galleria.has-4)
      { src: "antipasto-misto.jpg", alt: "Antipasto misto della tradizione piemontese" },
      { src: "agnolotti-sugo-arrosto.jpg", alt: "Agnolotti al sugo d'arrosto" },
      { src: "guancia-brasata.jpg", alt: "Guancia brasata su purè di patate" },
      { src: "pesche-langarola.jpg",       alt: "Pesche alla langarola con amaretto" },
    ],
  },

  /* ─── 3-quater. INVITO SOPRA IL FORM ─────────────────────────────────── */
  /* Riga di lancio subito prima del form. Metti attivo:false per nasconderla. */
  invito: {
    attivo: true,
    // Come l'headline dell'hero: <em> evidenzia una parola in oro corsivo
    titolo: "Lasciati trasportare in un viaggio pieno di <em>sapori</em> della vera cucina piemontese nel cuore di Torino",
    sottotitolo: "Un tavolo, quattro portate e il tempo di goderselo. Bastano trenta secondi per prenotare.",
  },

  /* ─── 4. CONTATTI / FOOTER ──────────────────────────────────────────── */
  contatti: {
    indirizzo: "Corso Moncalieri 216/F, 10133 Torino",
    telefono:  "011 276 4475",
    email:     "info@trattoriacirio.it",   // "" = non mostrata nel footer
    linkMappe: "https://www.google.com/maps/search/?api=1&query=Corso+Moncalieri+216%2FF+10133+Torino",
    social: {
      instagram: "",   // metti l'URL per mostrare l'icona Instagram; "" = nascosta

    // Orari mostrati nel footer (testo libero, aggiungi/rimuovi righe a piacere)

      { giorno: "Lunedì – Venerdì",   orario: "19:30 – 22:30" },
      { giorno: "Sabato e Domenica",  orario: "12:30 – 14:30 · 19:30 – 22:30" },
    ],

    /* Sezione "Trovaci qui" con la mappa di Google incorporata.
       `query` è quello che si cerca su Maps: nome + indirizzo dà il segnaposto
       giusto anche quando il civico da solo sarebbe ambiguo. */
    mappa: {
      attivo:    true,
      occhiello: "Dove siamo",
      titolo:    "Trovaci qui",
      query:     "Antica Trattoria Cirio, Corso Moncalieri 216/F, 10133 Torino",
      linkTesto: "Apri in Google Maps",
    },
  },

  /* ─── 5. PRENOTAZIONI — LOGICA DISPONIBILITÀ ★ CUORE DEL TEMPLATE ★ ──── */
  prenotazioni: {
    capienzaCoperti: 60,   // ← coperti totali disponibili per OGNI fascia oraria

    // Fasce orarie selezionabili dall'utente (pranzo 12:30–14:30, cena 19:30–22:30, ogni 30 min)
    fasceOrarie: [
      "12:30","13:00","13:30","14:00","14:30",
      "19:30","20:00","20:30","21:00","21:30","22:00","22:30"
    ],

    // Giorni di chiusura settimanale (0=Domenica, 1=Lunedì … 6=Sabato)
    giorniChiusura: [],   // aperto tutti i giorni

    /* Pranzo a servizio ridotto in certi mesi: il locale resta aperto 7 giorni
       su 7, ma a pranzo solo nel fine settimana. La cena non è mai toccata.
       Ad agosto 2026: pranzo solo sabato e domenica. Per togliere la regola
       basta attivo:false (o svuotare `mesi` a settembre). */
    pranzoRidotto: {
      attivo: true,
      mesi:   [7],        // 0=gennaio … 7=agosto
      giorni: [6, 0],     // giorni in cui il pranzo RESTA attivo (6=sab, 0=dom)
      fasce:  ["12:30","13:00","13:30","14:00","14:30"],   // deve restare allineata a fasceOrarie
      nota:   "Ad agosto il pranzo è servito solo sabato e domenica. La cena tutti i giorni.",
    },

    maxPersonePrenotazione: 50,  // limite persone per singola prenotazione
    sogliaUltimiPosti:      8,   // sotto N coperti liberi mostra "Ultimi posti"
    giorniPrenotabili:      60,  // finestra prenotabile in giorni a partire da oggi

    // COPERTI GIÀ OCCUPATI: vuoto in produzione (i conteggi arrivano dallo Sheet / localStorage).
    // Chiave = data "YYYY-MM-DD" → { "HH:MM": coperti_gia_prenotati }
    occupatiDemo: {},
    ancoraDemo: false,
  },

  /* ─── 6. INTEGRAZIONE GOOGLE SHEETS (una diversa per ogni ristorante) ── */
  integrazione: {
    // URL della Web App di Google Apps Script collegata allo Sheet del cliente.
    // Ogni landing → uno Sheet diverso → basta incollare qui l'URL giusto.
    // Lascialo "" per lavorare solo in locale (demo).
    // 👉 Come crearlo: vedi il README (sezione "Collegare Google Sheets").
    googleSheetsWebAppUrl: "https://script.google.com/macros/s/AKfycbzP7HAstenwOEODmJz8ifNz3CJFFhRdH8YMYp9DaipRJ9Nz1NslzSljF3SMJQfkyNYfhw/exec",

    // Se true, all'apertura la pagina prova a leggere i coperti occupati reali
    // dallo Sheet (richiede la Web App configurata per rispondere ai GET).
    leggiOccupatiDaSheets: false,
  },

  /* ─── 7. TESTI FISSI (di norma non serve toccarli) ──────────────────── */
  testi: {
    formTitolo:     "Prenota il tuo tavolo",
    stepData:       "Data",
    stepPersone:    "Persone",
    stepOrario:     "Orario",
    labelNome:      "Nome e cognome",
    labelTelefono:  "Numero di telefono",
    labelEmail:     "Email",
    labelRichieste: "Richieste speciali",
    btnConferma:    "Conferma prenotazione",
    successTitolo:  "Prenotazione confermata!",
    successMsg:     "Grazie per aver scelto la nostra tavola. Ti aspettiamo!",
  },

  /* ─── 8. CONSENSO PRIVACY (checkbox obbligatoria prima di confermare) ─── */
  privacy: {
    // Testo mostrato accanto alla checkbox. La parola indicata in "linkTesto"
    // diventa un link cliccabile verso "linkUrl" (se compilato).
    testo:     "Ho letto e accetto l'informativa sulla privacy e acconsento al trattamento dei miei dati personali per la gestione della prenotazione.",
    linkTesto: "informativa sulla privacy",   // parola da trasformare in link ("" per nessun link)
    linkUrl:   "privacy.html",                 // URL dell'informativa completa (pagina inclusa nel template)
  },

  /* ─── 9. TRACKING (Meta Pixel) ──────────────────────────────────────── */
  tracking: {
    metaPixelId:       "1011565005220041",  // ID del Meta Pixel; "" = tracciamento disattivato
    eventoConversione: "Lead",              // evento standard inviato a prenotazione confermata (es. "Lead" o "Schedule")
  },
};
</script>

<style>

}

html{overflow-x:hidden;-webkit-text-size-adjust:100%;scroll-behavior:smooth}

  content:'';

  inset:0;
  background:
    radial-gradient(ellipse 80% 60% at 50% 0%, rgba(184,147,58,.06) 0%, transparent 70%),
    radial-gradient(ellipse 60% 40% at 100% 100%, rgba(184,147,58,.04) 0%, transparent 60%);

  z-index:0;
}

  position:relative;

  /* Rispetta le "aree sicure" dei device con notch/home indicator */

  padding-bottom:calc(40px + env(safe-area-inset-bottom, 0px));
  padding-left:max(24px, env(safe-area-inset-left, 0px));
  padding-right:max(24px, env(safe-area-inset-right, 0px));

  flex-direction:column;
  align-items:center;
}

.offerta-cta:hover{filter:brightness(1.04);box-shadow:var(--shadow-lg)}
.offerta-cta:active{transform:scale(.99)}
.offerta-cta:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* Riga "Posti limitati" sotto il bottone */
.offerta-urgenza{
  margin-top:12px;
  font-size:11.5px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;
  color:var(--gold);
}

/* ── GALLERIA FOTO (3 immagini sotto il form) ── */
.galleria-sec{width:100%;margin-bottom:var(--gap-sezioni)}
/* Stessa scala tipografica dell'headline dell'hero */
.galleria-titolo{
  font-family:var(--font-display);
  font-size:clamp(30px,8vw,46px);font-weight:700;line-height:1.08;
  color:var(--ink);text-align:center;letter-spacing:-.5px;margin-bottom:16px;
}
.galleria-titolo em{font-style:italic;color:var(--gold)}
.galleria-sottotitolo{
  font-size:clamp(13px,3.3vw,14.5px);color:var(--ink-light);line-height:1.6;
  text-align:center;max-width:500px;margin:0 auto 20px;
}
/* Invito appena sopra il form: stessa famiglia dell'headline, un gradino più
   piccolo perché la frase è lunga e non deve rubare la scena al form. */
.invito-sec{width:100%;margin-bottom:22px}
.invito-titolo{
  font-family:var(--font-display);
  font-size:clamp(24px,6.2vw,36px);font-weight:700;line-height:1.14;
  color:var(--ink);text-align:center;letter-spacing:-.4px;
  max-width:620px;margin:0 auto;
}
.invito-titolo em{font-style:italic;color:var(--gold)}
.invito-sottotitolo{
  font-size:clamp(13px,3.3vw,14.5px);color:var(--ink-light);line-height:1.6;
  text-align:center;max-width:460px;margin:12px auto 0;
}

/* ── Trovaci qui: indirizzo, orari e mappa incorporata ── */
/* Il margine sopra la stacca dalla riga "Prenotazione sicura", che è
   attaccata al form e non ha spazio proprio in coda. */
.mappa-sec{width:100%;margin:var(--gap-sezioni) 0 0;text-align:center}
.mappa-occhiello{
  font-family:'League Spartan',sans-serif;font-size:11px;font-weight:800;
  letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:8px;
}
.mappa-titolo{
  font-family:var(--font-display);font-size:clamp(26px,7vw,38px);font-weight:700;
  line-height:1.1;color:var(--ink);letter-spacing:-.4px;margin-bottom:16px;
}
.mappa-dati{margin-bottom:18px}
.mappa-indirizzo{font-size:clamp(15px,3.8vw,17px);font-weight:600;color:var(--ink);line-height:1.5}
.mappa-orari{margin-top:10px;font-size:clamp(12.5px,3.2vw,13.5px);color:var(--ink-light);line-height:1.7}
.mappa-orari .g{font-weight:600;color:var(--ink)}
/* Il riquadro dà l'altezza; l'iframe la riempie. Leggera desaturazione per non
   far litigare i colori di Google con la palette della pagina. */
.mappa-box{
  width:100%;height:300px;border-radius:var(--radius-md);overflow:hidden;
  border:1px solid rgba(184,147,58,.18);box-shadow:var(--shadow-md);background:var(--gray-100);
}
.mappa-box iframe{width:100%;height:100%;border:0;display:block;filter:grayscale(.25) contrast(1.03)}
.mappa-link{
  display:inline-block;margin-top:14px;font-size:13px;font-weight:600;
  color:var(--gold);text-decoration:none;border-bottom:1px solid rgba(184,147,58,.45);
  padding-bottom:2px;
}
.mappa-link:hover{color:var(--ink);border-bottom-color:var(--ink)}
@media (max-width:420px){
  .mappa-box{height:240px}
}
/* La griglia si adatta al numero di foto: la classe has-2 / has-3 la mette il JS. */
.galleria{display:grid;gap:12px}
/* Due foto: impaginazione sfalsata, una più grande e una più piccola
   ribassata — taglio da rivista, evita l'effetto "due francobolli uguali".
   Lo scarto verticale scala col viewport, così i due scatti finiscono quasi
   alla stessa altezza sia su telefono che su desktop. */
.galleria.has-2{grid-template-columns:1.2fr 1fr;align-items:start}
.galleria.has-2 .tile:nth-child(1){aspect-ratio:4 / 5}
.galleria.has-2 .tile:nth-child(2){aspect-ratio:3 / 4;margin-top:clamp(18px,5vw,42px)}
/* Tre foto: una grande a sinistra, due impilate a destra */
.galleria.has-3{grid-template-columns:1.35fr 1fr;grid-template-rows:1fr 1fr;height:400px}
/* Quattro foto: griglia 2×2, tutte in verticale.
   Gli scatti dei piatti che abbiamo sono tutti verticali; forzarne due in
   orizzontale vorrebbe dire tagliare il piatto. Se in futuro arrivano due
   foto girate in orizzontale, basta sostituire le due righe qui sotto con:
     .galleria.has-4 .tile:nth-child(3),
     .galleria.has-4 .tile:nth-child(4){grid-column:1 / 3;aspect-ratio:16 / 9}
   e la terza e la quarta tornano a tutta larghezza, una sotto l'altra. */
.galleria.has-4{grid-template-columns:1fr 1fr}
.galleria.has-4 .tile{aspect-ratio:4 / 5}
.galleria .tile{
  position:relative;overflow:hidden;border-radius:var(--radius-md);
  background:var(--gold-pale);
  box-shadow:var(--shadow-md);
  border:1px solid rgba(184,147,58,.12);
}
.galleria.has-3 .tile:nth-child(1){grid-row:1 / 3}
.galleria .tile img{
  width:100%;height:100%;object-fit:cover;display:block;
  opacity:0;transition:opacity .35s ease,transform .5s ease;
}
.galleria .tile.is-loaded img{opacity:1}
.galleria .tile.is-loaded:hover img{transform:scale(1.05)}
/* Il segnaposto è lo stato di partenza: resta finché il file non c'è davvero.
   Appena la foto carica, il tile prende .is-loaded e il segnaposto sparisce. */
.galleria .tile:not(.is-loaded){
  border:1px dashed rgba(184,147,58,.4);box-shadow:none;
}
.galleria .tile .segnaposto{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--gold);font-weight:600;text-align:center;padding:0 10px;
}
.galleria .tile.is-loaded .segnaposto{display:none}
@media (max-width:520px){
  .galleria.has-3{grid-template-columns:1fr 1fr;grid-template-rows:200px 130px;height:auto}
  .galleria.has-3 .tile:nth-child(1){grid-row:1;grid-column:1 / 3}
  .offerta{padding:24px 20px}
}

/* ── CTA hero ── */
/* ── Booking widget ── */
.booking-card{
  width:100%;background:var(--warm-white);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-lg);overflow:hidden;
  border:1px solid rgba(184,147,58,.12);
  scroll-margin-top:20px;
}
.booking-header{
  display:flex;align-items:center;justify-content:center;position:relative;
  padding:18px 20px;background:var(--warm-white);border-bottom:1px solid var(--gray-200);
}
.booking-back{
  position:absolute;left:16px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;padding:6px;color:var(--gold);
  display:flex;align-items:center;justify-content:center;border-radius:8px;transition:background .15s;
}
.booking-back:hover{background:var(--gold-pale)}
.booking-back:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.booking-back svg{width:20px;height:20px;stroke:var(--gold);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.booking-back.hidden{visibility:hidden;pointer-events:none}
.booking-header-inner{display:flex;flex-direction:column;align-items:center;gap:2px}
.booking-brand{
  font-family:'League Spartan',sans-serif;font-size:11px;font-weight:800;
  letter-spacing:3px;text-transform:uppercase;color:var(--gold);line-height:1;
}
.booking-title{font-size:16px;font-weight:600;color:var(--ink);letter-spacing:.2px}
.booking-progress{width:80px;height:3px;background:var(--gray-200);border-radius:999px;display:none;overflow:hidden}
.booking-progress-fill{height:100%;background:var(--gold);border-radius:999px;width:0%;transition:width .3s ease}
.booking-wizard.summary-mode .booking-header-inner{display:none}
.booking-wizard.summary-mode .booking-progress{display:block}

/* ── Wizard frame ── */
.wizard-frame{background:var(--gray-100);padding:16px;min-height:460px;display:flex;flex-direction:column}
.wizard-toolbar{margin-bottom:14px;min-height:72px;flex-shrink:0}
.wizard-content{flex:1;min-height:340px;display:flex;flex-direction:column}
.wizard-content .step-panel.active{animation:fadeIn .22s ease;width:100%}
.booking-wizard.success-mode .wizard-toolbar{display:none;margin:0;min-height:0}
.booking-wizard.success-mode .wizard-content{min-height:0;justify-content:flex-start}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

/* ── Step tabs ── */
.step-tabs{display:flex;gap:8px}
.step-tab{
  flex:1;background:var(--warm-white);border-radius:var(--radius-sm);padding:12px 8px;
  text-align:center;border:1px solid transparent;transition:border-color .2s,box-shadow .2s;
  cursor:default;min-width:0;
}
.step-tab.active{border-color:var(--gold-light);box-shadow:0 0 0 2px rgba(184,147,58,.08), var(--shadow-sm)}
.step-tab.done{cursor:pointer}
.step-tab.done:hover{border-color:var(--gray-300)}
.step-tab-icon{display:flex;justify-content:center;margin-bottom:5px;color:var(--gray-400)}
.step-tab.active .step-tab-icon,.step-tab.done .step-tab-icon{color:var(--gold)}
.step-tab-label{font-size:10px;color:var(--gray-400);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.3px;text-transform:uppercase;font-weight:500}
.step-tab.active .step-tab-label,.step-tab.done .step-tab-label{color:var(--ink-light);font-weight:600}
.step-tab-value{font-size:12px;color:var(--ink);font-weight:600;margin-top:2px}

/* ── Summary bar ── */
.summary-bar{display:none;background:var(--warm-white);border-radius:var(--radius-sm);box-shadow:var(--shadow-sm);overflow:hidden;border:1px solid var(--gray-200)}
.summary-bar.visible{display:flex}
.summary-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 8px;gap:5px;position:relative}
.summary-item:not(:last-child)::after{content:'';position:absolute;right:0;top:20%;height:60%;width:1px;background:var(--gray-200)}
.summary-item svg{width:18px;height:18px;stroke:var(--gold);fill:none;stroke-width:1.8}
.summary-item span{font-size:12px;font-weight:600;color:var(--ink)}
.summary-item.pending svg{stroke:var(--gray-300)}
.summary-item.pending span{color:var(--gray-400)}

/* ── Cards ── */
.wizard-card{background:var(--warm-white);border-radius:var(--radius-md);padding:20px;box-shadow:var(--shadow-sm);border:1px solid var(--gray-200)}

/* ── Calendar ── */
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.cal-month{font-family:var(--font-display);font-size:17px;font-weight:600;color:var(--ink)}
.cal-nav{display:flex;gap:8px}
.cal-nav button{background:var(--gray-100);border:1px solid var(--gray-200);cursor:pointer;padding:6px;color:var(--gold);display:flex;align-items:center;border-radius:8px;transition:background .15s}
.cal-nav button:hover:not(:disabled){background:var(--gold-pale)}
.cal-nav button:disabled{opacity:.35;cursor:not-allowed}
.cal-nav button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.cal-nav svg{width:16px;height:16px;stroke:var(--gold);fill:none;stroke-width:2.5;stroke-linecap:round}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;margin-bottom:10px}
.cal-weekdays span{font-size:10px;font-weight:700;color:var(--gray-400);letter-spacing:1px;text-transform:uppercase}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal-day{
  aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:14px;
  border-radius:8px;cursor:pointer;border:none;background:none;font-family:var(--font-body);
  color:var(--ink);transition:background .12s,color .12s;font-weight:400;
}
.cal-day:hover:not(.disabled):not(.empty){background:var(--gold-pale);color:var(--gold)}
.cal-day:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.cal-day.disabled{color:var(--gray-300);cursor:not-allowed}
.cal-day.closed{color:var(--gray-300);cursor:not-allowed;text-decoration:line-through;text-decoration-color:var(--gray-300)}
.cal-day.empty{cursor:default}
.cal-day.selected{background:var(--gold);color:var(--warm-white);font-weight:600}
.cal-day.today:not(.selected){font-weight:700;color:var(--gold);background:var(--gold-pale)}

/* ── People grid ── */
.people-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:20px}
.people-btn{
  padding:12px 6px;border:1px solid var(--gray-200);border-radius:var(--radius-sm);
  background:var(--warm-white);color:var(--ink);font-size:15px;font-weight:500;cursor:pointer;
  font-family:var(--font-body);transition:all .15s;
}
.people-btn:hover{border-color:var(--gold);color:var(--gold);background:var(--gold-pale)}
.people-btn:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.people-btn.selected{background:var(--gold);color:var(--warm-white);border-color:var(--gold);font-weight:600}
.people-custom label{display:block;font-size:13px;font-weight:600;margin-bottom:8px;color:var(--ink-light);text-transform:uppercase;letter-spacing:.5px}
.people-custom-row{display:flex;gap:8px;align-items:stretch}
.people-custom-row input{
  flex:1;padding:12px 14px;border:1px solid var(--gray-200);border-radius:var(--radius-sm);
  font-size:15px;font-family:var(--font-body);outline:none;background:var(--warm-white);color:var(--ink);transition:border-color .15s;
}
.people-custom-row input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,147,58,.08)}
.people-custom-row input::placeholder{color:var(--gray-400)}
.people-submit{
  width:44px;min-width:44px;border:1px solid var(--gold);border-radius:var(--radius-sm);
  background:var(--gold-pale);color:var(--gold);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:all .15s;
}
.people-submit:hover{background:var(--gold);color:var(--warm-white)}
.people-submit:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.people-submit svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round}

/* ── Time grid ── */
.time-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.time-btn{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:12px 6px;border:1px solid var(--gray-200);border-radius:var(--radius-sm);
  background:var(--warm-white);color:var(--ink);font-size:15px;font-weight:600;cursor:pointer;
  font-family:var(--font-body);transition:all .15s;letter-spacing:.3px;
}
.time-btn:hover:not(.full){border-color:var(--gold);color:var(--gold);background:var(--gold-pale)}
.time-btn:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.time-btn.selected{background:var(--gold);color:var(--warm-white);border-color:var(--gold)}
.time-btn.selected .time-status{color:rgba(255,255,255,.85)}
/* Fascia piena / non sufficiente → grigia e NON cliccabile */
.time-btn.full{
  background:var(--gray-100);color:var(--gray-400);border-color:var(--gray-200);
  cursor:not-allowed;opacity:.85;
}
.time-status{font-size:9.5px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;line-height:1}
.time-status.last{color:var(--gold)}
.time-status.full{color:var(--gray-400)}

/* ── Step 4 form ── */
.summary-form{padding-top:4px}
.form-field{margin-bottom:20px}
.form-field label{display:block;font-size:11px;font-weight:700;color:var(--ink-light);margin-bottom:8px;text-transform:uppercase;letter-spacing:.8px}
.form-field input,.form-field textarea{
  width:100%;border:none;border-bottom:1.5px solid var(--gray-200);padding:8px 0;
  font-size:16px;font-family:var(--font-body);outline:none;background:transparent;color:var(--ink);transition:border-color .15s;
}
.form-field input:focus,.form-field textarea:focus{border-bottom-color:var(--gold)}
.form-field textarea{resize:none;min-height:56px}
.field-error{display:block;font-size:11px;color:var(--rust,#c0392b);margin-top:6px;font-weight:500;min-height:0}
.field-nota{display:block;font-size:11.5px;color:var(--ink-light);margin-top:6px;line-height:1.45}

/* ── Consenso privacy ── */
.privacy-field{margin:4px 0 8px}
.privacy-check{display:flex;align-items:flex-start;gap:10px;cursor:pointer;font-size:12.5px;line-height:1.5;color:var(--ink-light)}
.privacy-check input[type="checkbox"]{
  flex-shrink:0;appearance:none;-webkit-appearance:none;
  width:20px;height:20px;margin-top:1px;border:1.5px solid var(--gray-300);border-radius:6px;
  background:var(--warm-white);cursor:pointer;position:relative;transition:background .15s,border-color .15s;
}
.privacy-check input[type="checkbox"]:hover{border-color:var(--gold)}
.privacy-check input[type="checkbox"]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.privacy-check input[type="checkbox"]:checked{background:var(--gold);border-color:var(--gold)}
.privacy-check input[type="checkbox"]:checked::after{
  content:'';position:absolute;left:6px;top:2px;width:5px;height:10px;
  border:solid var(--warm-white);border-width:0 2px 2px 0;transform:rotate(45deg);
}
.privacy-text a{color:var(--gold);text-decoration:underline}
/* ── Form su pagina unica (niente step: tutti i campi, CTA in fondo) ── */
.form-flat{background:var(--gray-100);padding:20px 16px 18px}
.form-row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-flat .form-field{margin-bottom:16px}

/* Campi a box bianco sul fondo grigio: danno profondità al modulo, che con la
   sola riga sotto risultava piatto. Etichetta sopra, riquadro da riempire sotto. */
.form-flat .form-field input,
.form-flat .form-field textarea,
.form-flat .form-field select{
  width:100%;box-sizing:border-box;
  background:var(--warm-white);color:var(--ink);
  border:1px solid var(--gray-200);border-bottom:1px solid var(--gray-200);
  border-radius:14px;padding:13px 16px;
  font-size:16px;font-family:var(--font-body);outline:none;
  box-shadow:0 1px 2px rgba(26,22,18,.05);
  transition:border-color .15s,box-shadow .15s;
}
.form-flat .form-field input:hover,
.form-flat .form-field textarea:hover,
.form-flat .form-field select:hover{border-color:var(--gray-300)}
.form-flat .form-field input:focus,
.form-flat .form-field textarea:focus,
.form-flat .form-field select:focus{
  border-color:var(--gold);
  box-shadow:0 0 0 3px rgba(184,147,58,.14);
}
/* Stessa altezza per input e select, così le coppie affiancate si allineano */
.form-flat .form-field input,
.form-flat .form-field select{min-height:50px}
/* Bottone e casella privacy seguono lo stesso raggio dei campi */
.form-flat .btn-conferma{border-radius:14px}
.form-flat .privacy-check input[type="checkbox"]{border-radius:8px}
.form-flat .form-field textarea{min-height:64px}

/* La freccia della select: nativa nascosta, ridisegnata in oro dentro il box */
.form-flat .form-field select{
  appearance:none;-webkit-appearance:none;padding-right:38px;cursor:pointer;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23b8933a' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
  background-repeat:no-repeat;background-position:right 13px center;background-size:15px;
}
.form-flat .form-field select option:disabled{color:var(--gray-400)}
@media (max-width:420px){
  .form-row2{grid-template-columns:1fr;gap:0}
}
.btn-conferma{
  width:100%;padding:16px;border:none;border-radius:var(--radius-sm);
  background:var(--gray-200);color:var(--gray-400);font-size:15px;font-weight:700;cursor:not-allowed;
  font-family:var(--font-body);margin-top:12px;transition:background .25s,color .25s,transform .1s,box-shadow .2s;
  letter-spacing:.5px;text-transform:uppercase;
}
.btn-conferma:disabled{background:var(--gray-200)!important;color:var(--gray-400)!important;cursor:not-allowed!important}
.btn-conferma.ready:not(:disabled){background:var(--cta-bg);color:var(--cta-text);cursor:pointer;box-shadow:var(--shadow-md)}
.btn-conferma.ready:not(:disabled):hover{filter:brightness(1.04);box-shadow:var(--shadow-lg)}
.btn-conferma.ready:not(:disabled):active{transform:scale(.99)}
.btn-conferma.sending{opacity:.7;cursor:wait!important}

/* ── Success ── */
.success-screen{text-align:center;padding:28px 20px 32px;background:var(--warm-white);border-radius:var(--radius-md);border:1px solid var(--gray-200);width:100%}
.success-icon{
  width:72px;height:72px;border-radius:50%;
  background:linear-gradient(135deg,rgba(184,147,58,.12),rgba(184,147,58,.06));
  border:1.5px solid rgba(184,147,58,.3);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;

.success-icon svg{width:32px;height:32px;stroke:var(--gold);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

<script>
/* ╔═══════════════════════════════════════════════════════════════════════╗
   ║  MOTORE DELLA LANDING — non serve modificarlo per customizzare.        ║
   ║  Tutto legge da CONFIG. Le funzioni di disponibilità sono isolate e    ║
   ║  documentate (getPostiOccupati / getDisponibilita / isFasciaDisponibile).║
   ╚═══════════════════════════════════════════════════════════════════════╝ */
(function(){
  'use strict';

  const C = CONFIG;
  const P = C.prenotazioni;
  const MONTHS_IT = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
  const LS_KEY = 'fml_bookings_' + slug(C.brand.nome);  // chiave localStorage per-ristorante

  /* Cache in memoria dei coperti occupati per data+ora.
     Struttura: { "YYYY-MM-DD": { "HH:MM": copertiOccupati } }
     Popolata da: (1) occupatiDemo di CONFIG, (2) localStorage, (3) [opzionale] Sheets. */
  let occupatiCache = {};

  const state = {
    date: null,
    people: null,
    time: null,
    sending: false,
    fbCheckout: false,   // per non inviare InitiateCheckout più volte
  };

  // Invia un evento al Meta Pixel (se attivo). Isolato così è facile da estendere.
  function trackFB(evento, parametri){
    try { if(window.fbq) fbq('track', evento, parametri || {}); } catch(e){}
  }

  /* ─────────────────────────────────────────────────────────────────────
     UTILITY DATE
     ───────────────────────────────────────────────────────────────────── */
  function startOfDay(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function isSameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
  function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
  function slug(s){ return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,''); }

  // Chiave canonica "YYYY-MM-DD" (usata come identificativo giorno ovunque)
  function keyData(d){
    const mm = String(d.getMonth()+1).padStart(2,'0');
    const dd = String(d.getDate()).padStart(2,'0');
    return d.getFullYear() + '-' + mm + '-' + dd;
  }
  /* ── Data e ora sempre riferite a Roma ──────────────────────────────────
     Il calendario nasceva dall'orologio del dispositivo: un cliente che apre
     la pagina da un altro fuso (o col telefono impostato male) vedrebbe un
     "oggi" diverso da quello del ristorante. Queste funzioni leggono sempre
     l'ora di Europe/Rome.                                                  */
  function partiRoma(d){
    const fmt = new Intl.DateTimeFormat('it-IT', {
      timeZone:'Europe/Rome',
      year:'numeric', month:'2-digit', day:'2-digit',
      hour:'2-digit', minute:'2-digit', hour12:false
    });
    const p = {};
    fmt.formatToParts(d).forEach(function(x){ p[x.type] = x.value; });
    return p;
  }
  // Mezzanotte di oggi, secondo il calendario italiano
  function oggiRoma(){
    const p = partiRoma(new Date());
    return new Date(Number(p.year), Number(p.month) - 1, Number(p.day));
  }
  // Momento dell'invio, in ora italiana: "02/08/2026 22:35"
  function adessoRoma(){
    const p = partiRoma(new Date());
    return p.day + '/' + p.month + '/' + p.year + ' ' + p.hour + ':' + p.minute;
  }

  // Formato italiano completo: "gio 14/08/2026"
  function formatData(d){
    const days = ['dom','lun','mar','mer','gio','ven','sab'];
    const dd = String(d.getDate()).padStart(2,'0');
    const mm = String(d.getMonth()+1).padStart(2,'0');
    return days[d.getDay()] + ' ' + dd + '/' + mm + '/' + d.getFullYear();
  }
  // Giorno di chiusura settimanale?
  function isGiornoChiuso(d){ return P.giorniChiusura.indexOf(d.getDay()) !== -1; }
  // Data prenotabile? (non passata, non chiusa, entro la finestra)
  function isDataValida(d){
    const oggi = oggiRoma();
    const limite = addDays(oggi, P.giorniPrenotabili);
    return d >= oggi && d <= limite && !isGiornoChiuso(d);
  }

  /* ═══════════════════════════════════════════════════════════════════════
     🔑 LOGICA DISPONIBILITÀ — cuore del template (isolata e documentata)
     ═══════════════════════════════════════════════════════════════════════
     Sorgente dati coperti occupati, in ordine di priorità:
       1. CONFIG.prenotazioni.occupatiDemo  → dati finti per la demo
       2. localStorage                       → prenotazioni fatte dall'utente
       3. [PRODUZIONE] Google Sheets / DB    → vedi caricaOccupatiDaSheets()

     👉 QUANDO PASSERAI A SUPABASE/DB REALE:
        sostituisci il contenuto di getPostiOccupati() con una query del tipo
        SELECT COALESCE(SUM(coperti),0) FROM bookings WHERE data=? AND ora=?;
        e mantieni identica la firma della funzione: tutto il resto continua
        a funzionare senza modifiche.
     ═══════════════════════════════════════════════════════════════════════ */

  // Legge le prenotazioni salvate localmente (array di oggetti prenotazione).
  function getPrenotazioniLocali(){
    try { return JSON.parse(localStorage.getItem(LS_KEY)) || []; }
    catch(e){ return []; }
  }

  // Ricostruisce occupatiCache unendo demo + localStorage (+ eventuale remoto già caricato).
  function ricostruisciCache(remoto){
    const cache = {};
    // 1) Dati demo da CONFIG
    Object.keys(P.occupatiDemo || {}).forEach(function(k){
      const realKey = ancoraChiaveDemo(k);
      cache[realKey] = Object.assign({}, cache[realKey], P.occupatiDemo[k]);
    });
    // 2) Prenotazioni salvate in localStorage
    getPrenotazioniLocali().forEach(function(b){
      if(!cache[b.data]) cache[b.data] = {};
      cache[b.data][b.ora] = (cache[b.data][b.ora] || 0) + Number(b.persone || 0);
    });
    // 3) Dati remoti già scaricati (Sheets) — sommati sopra i precedenti
    if(remoto){
      Object.keys(remoto).forEach(function(data){
        Object.keys(remoto[data]).forEach(function(ora){
          if(!cache[data]) cache[data] = {};
          cache[data][ora] = Math.max(cache[data][ora] || 0, Number(remoto[data][ora] || 0));
        });
      });
    }
    occupatiCache = cache;
  }

  // Converte una chiave demo tipo "GIORNO+1" in una data reale (oggi + N giorni).
  function ancoraChiaveDemo(k){
    if(P.ancoraDemo && /^GIORNO\+\d+$/.test(k)){
      const n = parseInt(k.split('+')[1], 10);
      return keyData(addDays(oggiRoma(), n));
    }
    return k;
  }

  /**
   * Coperti GIÀ OCCUPATI in una certa data + fascia oraria.
   * @param {string} dataKey  "YYYY-MM-DD"
   * @param {string} ora      "HH:MM"
   * @returns {number} coperti già prenotati (0 se nessuno).
   * ⬅️ IN PRODUZIONE: qui va la query allo Sheet/DB (vedi blocco sopra).
   */
  function getPostiOccupati(dataKey, ora){
    return (occupatiCache[dataKey] && occupatiCache[dataKey][ora]) || 0;
  }

  /**
   * Coperti ANCORA LIBERI in una data + fascia oraria.
   * @returns {number} capienzaCoperti - occupati (min 0).
   */
  function getDisponibilita(dataKey, ora){
    return Math.max(0, P.capienzaCoperti - getPostiOccupati(dataKey, ora));
  }

  /**
   * La fascia può accogliere una prenotazione di `persone` coperti?
   * Tiene conto sia della capienza sia delle persone della prenotazione in corso.
   * @returns {boolean}
   */
  function isFasciaDisponibile(dataKey, ora, persone){
    return getDisponibilita(dataKey, ora) >= persone;
  }

  /**
   * Salva una nuova prenotazione: (1) in localStorage per coerenza demo,
   * (2) sullo Google Sheet del cliente (se configurato).
   * @returns {Promise} risolta a invio completato (o subito, in solo-locale).
   */
  function salvaPrenotazione(prenotazione){
    // (1) Persistenza locale → aggiorna subito i conteggi/il grigetto
    const arr = getPrenotazioniLocali();
    arr.push(prenotazione);
    try { localStorage.setItem(LS_KEY, JSON.stringify(arr)); } catch(e){}
    ricostruisciCache();
    // (2) Invio allo Sheet del ristorante (una Web App diversa per ogni cliente)
    return inviaASheets(prenotazione);
  }

  /* ─────────────────────────────────────────────────────────────────────
     GOOGLE SHEETS — invio prenotazione (POST) e lettura occupati (GET)
     Ogni landing punta a uno Sheet diverso via CONFIG.integrazione.googleSheetsWebAppUrl.
     Setup della Web App: vedi README.
     ───────────────────────────────────────────────────────────────────── */
  function inviaASheets(prenotazione){
    const url = C.integrazione.googleSheetsWebAppUrl;
    if(!url) return Promise.resolve({ ok:true, locale:true });  // solo-locale (demo)
    // mode:'no-cors' + text/plain evita il preflight CORS con Apps Script.
    // Non possiamo leggere la risposta, ma la riga viene scritta sullo Sheet.
    return fetch(url, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(prenotazione),
    }).then(function(){ return { ok:true }; })
      .catch(function(err){ console.warn('Invio Sheets fallito:', err); return { ok:false }; });
  }

  // [OPZIONALE] Legge i coperti occupati reali dallo Sheet all'avvio.
  // Richiede una Web App che risponda ai GET con JSON: { "YYYY-MM-DD": { "HH:MM": n } }
  function caricaOccupatiDaSheets(){
    const url = C.integrazione.googleSheetsWebAppUrl;
    if(!url || !C.integrazione.leggiOccupatiDaSheets) return Promise.resolve(null);
    return fetch(url + '?action=occupati')
      .then(function(r){ return r.json(); })
      .catch(function(){ return null; });  // fallback silenzioso su demo+localStorage
  }

  /* ═══════════════════════════════════════════════════════════════════════
     RENDERING UI
     ═══════════════════════════════════════════════════════════════════════ */
  const els = {};

    // ── Trovaci qui: indirizzo, orari e mappa incorporata ──

      document.getElementById('mappaOcchiello').textContent = mp.occhiello || '';
      document.getElementById('mappaTitolo').textContent    = mp.titolo || '';

      document.getElementById('mappaOrari').innerHTML = (ct.orari||[]).map(function(o){

  /* Prepara un bottone-link che porta al form. È un <a href="#…">, così
     funziona anche se il JS non parte; con il JS lo scorrimento è morbido. */
  function montaCta(idElemento, conf){
    const cta = document.getElementById(idElemento);
    if (!cta || !conf || !conf.testo) { return; }
    const targetId = conf.target || 'prenota';
    cta.textContent = conf.testo;
    cta.setAttribute('href', '#' + targetId);
    cta.addEventListener('click', function(ev){
      const dest = document.getElementById(targetId);
      if (dest) { ev.preventDefault(); dest.scrollIntoView({ behavior:'smooth', block:'start' }); }
    });
    cta.style.display = '';
  }

  function esc(s){ return String(s).replace(/[&<>"]/g, function(m){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]; }); }

  // Costruisce il testo del consenso privacy, rendendo "linkTesto" un link se c'è "linkUrl".
  function buildPrivacyText(){
    const pv = C.privacy || {};
    let txt = esc(pv.testo || '');
    if(pv.linkTesto && pv.linkUrl){
      const parola = esc(pv.linkTesto);
      const link = '<a href="'+esc(pv.linkUrl)+'" target="_blank" rel="noopener">'+parola+'</a>';
      txt = txt.replace(parola, link);
    }
    return txt;
  }

  /* ── Data ──────────────────────────────────────────────────────────────
     Il campo nativo <input type="date"> apre il calendario del sistema:
     qui si impostano solo i limiti prenotabili e si valida la scelta. */
  function setupData(){
    const oggi = oggiRoma();
    els.inputData.min = keyData(oggi);
    els.inputData.max = keyData(addDays(oggi, P.giorniPrenotabili));
  }
  /* "YYYY-MM-DD" → Date locale. new Date("2026-08-05") sarebbe letta come UTC
     e in Italia tornerebbe il giorno prima: la si costruisce a mano. */
  function parseData(v){
    const p = String(v || '').split('-');
    if(p.length !== 3) return null;
    const d = new Date(+p[0], +p[1]-1, +p[2]);
    return isNaN(d.getTime()) ? null : d;
  }
  function onDataChange(){
    const d = parseData(els.inputData.value);
    els.errData.textContent = '';
    state.date = null;
    if(d){
      if(isDataValida(d)){
        state.date = d;
      } else {
        els.errData.textContent = isGiornoChiuso(d)
          ? 'Siamo chiusi in questa data, scegline un\'altra.'
          : 'Data non prenotabile, scegline un\'altra.';
      }
    }
    renderOrari();          // la disponibilità dipende dalla data
    validateForm();
  }

  /* ── Persone ── */
  function renderPersone(){
    const max = Math.min(20, P.maxPersonePrenotazione);
    let html = '<option value="">Scegli…</option>';
    for(let i = 1; i <= max; i++){
      html += '<option value="'+i+'">'+i+(i===1?' persona':' persone')+'</option>';
    }
    els.inputPersone.innerHTML = html;
  }
  function onPersoneChange(){
    state.people = parseInt(els.inputPersone.value, 10) || null;
    // Se l'orario scelto prima non regge più le nuove persone, azzeralo
    if(state.time && state.date && !isFasciaDisponibile(keyData(state.date), state.time, state.people)){
      state.time = null;
    }
    renderOrari();          // 🔁 ricalcola disponibilità in base alle persone
    validateForm();
  }

  /* ── Orario (con logica capienza) ── */
  // Orario già trascorso? Vale SOLO per la data odierna.
  function isSlotPassato(date, slot){
    if(!date) return false;
    if(!isSameDay(date, oggiRoma())) return false;
    // adessoRoma() è una stringa già formattata: l'ora corrente si prende da partiRoma
    const p = partiRoma(new Date());
    const parts = String(slot).split(':');
    return (parseInt(parts[0],10)*60 + parseInt(parts[1],10)) <
           (Number(p.hour)*60 + Number(p.minute));
  }
  /* Pranzo non servito in questa data? Vale solo nei mesi indicati in
     CONFIG.prenotazioni.pranzoRidotto e solo sulle fasce di pranzo. */
  function isPranzoChiuso(date, slot){
    const r = P.pranzoRidotto;
    if(!r || !r.attivo || !date) return false;
    if(r.mesi.indexOf(date.getMonth()) === -1) return false;   // mese non interessato
    if(r.fasce.indexOf(slot) === -1) return false;             // è una fascia di cena
    return r.giorni.indexOf(date.getDay()) === -1;             // giorno senza pranzo
  }
  function renderOrari(){
    const dataKey = state.date ? keyData(state.date) : null;
    const persone = state.people || 1;
    let html = '<option value="">Scegli…</option>';
    let confermato = false;
    let pranzoNascosto = false;

    P.fasceOrarie.forEach(function(slot){
      // Fasce di pranzo non servite: fuori dall'elenco, non disabilitate.
      // Nove voci grigie renderebbero la tendina illeggibile.
      if(isPranzoChiuso(state.date, slot)){ pranzoNascosto = true; return; }
      const disponibili = dataKey ? getDisponibilita(dataKey, slot) : P.capienzaCoperti;
      const passato = isSlotPassato(state.date, slot);
      const ok = disponibili >= persone && !passato;

      // Lo stato finisce nell'etichetta: in una <select> non c'è spazio per un badge
      let nota = '';
      if(passato)                                 nota = ' — non più disponibile';
      else if(disponibili <= 0)                   nota = ' — completo';
      else if(!ok)                                nota = ' — solo ' + disponibili + (disponibili===1?' posto':' posti');
      else if(disponibili <= P.sogliaUltimiPosti) nota = ' — ultimi posti';

      const sel = (state.time === slot && ok);
      if(sel) confermato = true;
      html += '<option value="'+slot+'"'+(ok?'':' disabled')+(sel?' selected':'')+'>'+slot+nota+'</option>';
    });

    els.inputOrario.innerHTML = html;
    if(!confermato) state.time = null;   // l'orario di prima non regge più
    els.errOrario.textContent = '';
    // Spiega perché mancano gli orari di pranzo, altrimenti sembra un errore
    const nota = (P.pranzoRidotto && P.pranzoRidotto.nota) || '';
    els.notaOrario.textContent = pranzoNascosto ? nota : '';
    els.notaOrario.style.display = (pranzoNascosto && nota) ? '' : 'none';
  }
  function onOrarioChange(){
    state.time = els.inputOrario.value || null;
    validateForm();
  }


  /* ── Validazione form contatti ── */
  function validaTelefono(tel){
    // Almeno 7 cifre; ammette +, spazi, trattini, parentesi
    const cifre = tel.replace(/[^\d]/g,'');
    return cifre.length >= 7;
  }
  function validaEmail(email){
    // Formato base valido: qualcosa@qualcosa.dominio
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  }
  function validateForm(){
    const nome = els.inputNome.value.trim();
    const tel = els.inputTelefono.value.trim();
    const email = els.inputEmail.value.trim();
    const privacyOk = els.inputPrivacy.checked;          // ← consenso obbligatorio
    const bookingComplete = !!(state.date && state.people && state.time);
    const telOk = validaTelefono(tel);
    const emailOk = validaEmail(email);
    const formComplete = !!(nome && telOk && emailOk);
    // messaggi d'errore (solo se l'utente ha già scritto qualcosa)
    els.errTelefono.textContent = (tel && !telOk) ? 'Inserisci un numero di telefono valido' : '';
    els.errEmail.textContent = (email && !emailOk) ? 'Inserisci un indirizzo email valido' : '';
    // Funnel: data, persone e ora scelte → l'utente è di fatto al checkout.
    // Prima corrispondeva all'arrivo allo step 4, che qui non esiste più.
    if(bookingComplete && !state.fbCheckout){
      state.fbCheckout = true;
      trackFB('InitiateCheckout', { content_name: C.brand.nome });
    }
    // Il bottone si accende solo con prenotazione completa, contatti validi E privacy spuntata
    const isReady = bookingComplete && formComplete && privacyOk && !state.sending;
    els.btnConferma.classList.toggle('ready', isReady);
    els.btnConferma.disabled = !isReady;
  }

  /* ── Conferma prenotazione ── */
  function confirmBooking(){
    if(els.btnConferma.disabled || state.sending) return;

    const dataKey = keyData(state.date);
    // Doppio controllo capienza al momento dell'invio (anti-race lato demo)
    if(isPranzoChiuso(state.date, state.time) || !isFasciaDisponibile(dataKey, state.time, state.people)){
      renderOrari();
      els.errOrario.textContent = 'Questa fascia si è appena riempita, scegli un altro orario.';
      els.inputOrario.focus();
      validateForm();
      return;
    }

    const prenotazione = {
      ristorante: C.brand.nome,
      data:       dataKey,                 // "YYYY-MM-DD"
      dataLabel:  formatData(state.date),
      ora:        state.time,
      persone:    state.people,
      nome:       els.inputNome.value.trim(),
      telefono:   els.inputTelefono.value.trim(),
      email:      els.inputEmail.value.trim(),
      richieste:  els.inputRichieste.value.trim(),
      privacy:    els.inputPrivacy.checked ? 'Sì' : 'No',   // consenso registrato
      origine:    (C.origine || ''),
      sorgente:   (typeof location !== 'undefined' ? location.hostname : ''),
      creata:     adessoRoma(),          // ora italiana, non UTC
    };

    state.sending = true;
    els.btnConferma.classList.add('sending');
    els.btnConferma.textContent = 'Invio in corso…';

    salvaPrenotazione(prenotazione).then(function(){
      state.sending = false;
      mostraSuccesso(prenotazione);
    });
  }
  function mostraSuccesso(b){
    els.successDetails.innerHTML =
      '<p><strong>📅 Data:</strong> ' + esc(b.dataLabel) + '</p>' +
      '<p><strong>👥 Persone:</strong> ' + esc(String(b.persone)) + '</p>' +
      '<p><strong>🕐 Orario:</strong> ' + esc(b.ora) + '</p>' +
      '<p><strong>👤 Nome:</strong> ' + esc(b.nome) + '</p>' +
      '<p><strong>📞 Telefono:</strong> ' + esc(b.telefono) + '</p>' +
      '<p><strong>✉️ Email:</strong> ' + esc(b.email) + '</p>' +
      (b.richieste ? '<p><strong>📝 Richieste:</strong> ' + esc(b.richieste) + '</p>' : '');
    // 🎯 CONVERSIONE: prenotazione confermata → evento al Meta Pixel
    trackFB((C.tracking && C.tracking.eventoConversione) || 'Lead', {
      content_name: C.brand.nome,
      num_people: b.persone
    });
    els.formFlat.style.display = 'none';
    els.successScreen.style.display = '';
    els.successScreen.scrollIntoView({behavior:'smooth', block:'center'});
  }

  /* ── Reset ── */
  function resetBooking(){
    state.date=null; state.people=null; state.time=null; state.sending=false;
    state.fbCheckout=false;
    els.inputData.value=''; els.inputPersone.value=''; els.inputOrario.value='';
    els.inputNome.value=''; els.inputTelefono.value=''; els.inputEmail.value='';
    els.inputRichieste.value=''; els.inputPrivacy.checked=false;
    els.errData.textContent=''; els.errOrario.textContent='';
    els.notaOrario.textContent=''; els.notaOrario.style.display='none';
    els.errEmail.textContent=''; els.errTelefono.textContent='';
    els.btnConferma.classList.remove('ready','sending');
    els.btnConferma.textContent = C.testi.btnConferma;
    renderOrari();
    els.successScreen.style.display='none';
    els.formFlat.style.display='';
    validateForm();
    document.getElementById('prenota').scrollIntoView({behavior:'smooth', block:'start'});
  }

  /* ═══════════════════════════════════════════════════════════════════════
     EVENT LISTENERS
     ═══════════════════════════════════════════════════════════════════════ */
  els.inputData.addEventListener('change', onDataChange);
  els.inputData.addEventListener('input', onDataChange);
  els.inputPersone.addEventListener('change', onPersoneChange);
  els.inputOrario.addEventListener('change', onOrarioChange);
  els.inputNome.addEventListener('input', validateForm);
  els.inputTelefono.addEventListener('input', validateForm);
  els.inputEmail.addEventListener('input', validateForm);
  els.inputPrivacy.addEventListener('change', validateForm);
  els.btnConferma.addEventListener('click', confirmBooking);
  els.btnNewBooking.addEventListener('click', resetBooking);

  /* ═══════════════════════════════════════════════════════════════════════
     AVVIO
     ═══════════════════════════════════════════════════════════════════════ */
  /* Chi arriva dal link della campagna deve vedere l'offerta, non il form.
     Se nell'URL è rimasta l'ancora #prenota (succede quando si copia
     l'indirizzo dopo aver cliccato una CTA, o se la si incolla per errore
     nell'inserzione) il browser salterebbe dritto al modulo: qui la
     annulliamo e riportiamo la vista in cima, dove c'è il menu degustazione. */
  function apriSullOfferta(){
    if (location.hash !== '#prenota') { return; }
    if (history.replaceState) {
      history.replaceState(null, '', location.pathname + location.search);
    }
    const torna = function(){ window.scrollTo(0, 0); };
    torna();
    // il salto all'ancora avviene anche dopo il load: lo annulliamo di nuovo
    window.addEventListener('load', torna);
  }

  function init(){
    apriSullOfferta();
    applicaColori();
    popolaContenuti();
    ricostruisciCache();                 // demo + localStorage
    setupData();
    renderPersone();
    renderOrari();
    validateForm();
    // [Opzionale] carica occupati reali dallo Sheet e ridisegna gli orari
    caricaOccupatiDaSheets().then(function(remoto){
      if(remoto){ ricostruisciCache(remoto); renderOrari(); }
    });
  }
  init();
})();
</script>
</body>
</html>
